version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: pawconnect-mongo
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - pawconnect-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawconnect-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://mongodb:27017/pawconnect
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:80
      - JWT_SECRET=pawconnect_jwt_secret_key_2026_super_secure_dev
      - JWT_REFRESH_SECRET=pawconnect_jwt_refresh_secret_key_2026_dev
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - pawconnect-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pawconnect-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - pawconnect-network

volumes:
  mongo-data:
  backend-uploads:

networks:
  pawconnect-network:
    driver: bridge
